<!doctype html>
<html lang="fr"> 
 <head> 
  <meta charset="UTF-8"> 
  <title>Page de connexion</title> 
  <style>
    body {
      background-color: #111;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .login-box {
      background: #222;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 10px #000;
      width: 300px;
      text-align: center;
    }
    .login-box h2 {
      margin-bottom: 20px;
      color: #ffcc00;
    }
    .login-box input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: none;
      border-radius: 5px;
    }
    .login-box button {
      background-color: #ffcc00;
      border: none;
      padding: 10px;
      width: 100%;
      cursor: pointer;
      font-size: 16px;
      border-radius: 5px;
    }
    .login-box button:hover {
      background-color: #e6b800;
    }
  </style> 
 </head> 
 <body> 
  <div class="login-box"> 
   <h2>Connexion</h2> 
   <input type="text" id="username" placeholder="Nom d'utilisateur"> 
   <input type="password" id="password" placeholder="Mot de passe"> <button onclick="login()">Se connecter</button> 
   <p id="message"></p> 
  </div> 
  <script>
    function login() {
      const user = document.getElementById("username").value;
      const pass = document.getElementById("password").value;
      const message = document.getElementById("message");

      // Exemple simple : vérification statique
      if (user === "admin" && pass === "1234") {
        message.style.color = "lightgreen";
        message.innerHTML = "Connexion réussie ✅";
      } else {
        message.style.color = "red";
        message.innerHTML = "Nom d'utilisateur ou mot de passe incorrect ❌";
      }
    }
  </script> 
 </body>
</html>
